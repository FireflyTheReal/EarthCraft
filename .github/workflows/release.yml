name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package_release.py'
      - 'docs/RELEASING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: version
        name: Require a tag matching Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/package_release.py validate --tag "$RELEASE_TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: earthcraft
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: earthcraft.exe
          - os: windows-2022
            target: i686-pc-windows-msvc
            executable: earthcraft.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: earthcraft.exe
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: earthcraft
          - os: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            executable: earthcraft
          - os: macos-14
            target: aarch64-apple-darwin
            executable: earthcraft
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: earthcraft
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.89'
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux development libraries
        if: runner.os == 'Linux' && matrix.target != 'riscv64gc-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Install ArtCraft RISC-V cross-compilation dependencies
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        uses: storytold/craft-common-actions/actions/install-riscv64-cross@f0808a5ccbc32869248193ffab0de98d733de451
      - name: Install RISC-V GTK dependencies
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: sudo apt-get install -y --no-install-recommends libgtk-3-dev:riscv64
      - name: Build CPU-only release binary
        if: matrix.target != 'riscv64gc-unknown-linux-gnu'
        run: cargo build -p earthcraft --release --no-default-features --locked --target ${{ matrix.target }}
      - name: Cross-compile CPU-only RISC-V binary
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          PKG_CONFIG_SYSROOT_DIR: /
          PKG_CONFIG_LIBDIR: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: '1'
        run: cargo build -p earthcraft --release --no-default-features --locked --target riscv64gc-unknown-linux-gnu
      - name: Package binary and documentation
        run: python scripts/package_release.py package --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: earthcraft-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  freebsd:
    name: Build x86_64-unknown-freebsd
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and package in a native FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          cpu: 4
          mem: 8192
          envs: RELEASE_VERSION
          prepare: |
            pkg install -y rust python312 pkgconf gtk3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs
          run: |
            set -eu
            export CARGO_BUILD_JOBS=4
            cargo build -p earthcraft --release --no-default-features --locked --target x86_64-unknown-freebsd
            python3.12 scripts/package_release.py package --version "$RELEASE_VERSION" --target x86_64-unknown-freebsd --binary target/x86_64-unknown-freebsd/release/earthcraft --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: earthcraft-x86_64-unknown-freebsd
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [version, build, freebsd]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: earthcraft-*
          path: dist
          merge-multiple: true
      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if ! jq -e '.isDraft == true' release.json > /dev/null; then
              echo "::error::This release is already published; use a new version tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "EarthCraft $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
