[workspace]
members = [
    "apps/earthcraft",
    "crates/earthcraft-core",
    "crates/earthcraft-data",
    "crates/earthcraft-render",
]
default-members = ["apps/earthcraft"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
earthcraft-core = { path = "crates/earthcraft-core" }
earthcraft-data = { path = "crates/earthcraft-data" }
earthcraft-render = { path = "crates/earthcraft-render" }
eframe = "0.27"
emath = "0.27"
glam = { version = "0.34", default-features = false, features = ["std", "f64"] }
bytemuck = "1"
thiserror = "2"
rayon = "1.10"
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
