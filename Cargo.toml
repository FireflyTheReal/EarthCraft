[package]
name = "earthcraft"
version = "0.1.0"
edition = "2021"
description = "Globo 3D estilo Google Earth em Rust (Windows, macOS e Linux)"

[dependencies]
eframe = "0.27"
rayon = "1.10"
ureq = { version = "2.9", features = ["json"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
