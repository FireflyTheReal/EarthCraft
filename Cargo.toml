[workspace]
members = [
    "apps/earthcraft",
    "crates/earthcraft-core",
    "crates/earthcraft-data",
    "crates/earthcraft-render",
]
default-members = ["apps/earthcraft"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
earthcraft-core = { path = "crates/earthcraft-core" }
earthcraft-data = { path = "crates/earthcraft-data" }
earthcraft-render = { path = "crates/earthcraft-render", default-features = false }
eframe = "0.27"
# Native desktop menu adapters; keep GUI/platform dependencies out of the libraries.
muda = { version = "0.19.3", default-features = false }
emath = "0.27"
glam = { version = "0.34", default-features = false, features = ["std", "f64"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "0.19"
pollster = "0.4"
naga = { version = "0.19", features = ["wgsl-in"] }
wide = "1.7"
moka = { version = "0.12", default-features = false, features = ["sync"] }
thiserror = "2"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
unicode-normalization = "0.1"
quick-xml = "0.41"
kml = { version = "0.14", default-features = false }
rayon = "1.10"
rstar = "0.13"
geo-index = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "fs", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-rusqlite = "0.8"
fst = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
